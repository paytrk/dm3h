<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة الحروف</title>

<style>
body {
    font-family: Tahoma, Arial, sans-serif;
    background: url('https://files.catbox.moe/cia4uk.gif') no-repeat center center fixed;
    background-size: cover;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: -1;
}

.container {
    background: rgba(255,255,255,0.92);
    padding: 25px;
    border-radius: 20px;
    width: 100%;
    max-width: 500px;
    text-align: center;
}

input, button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    font-size: 18px;
    border-radius: 10px;
    border: 1px solid #ccc;
}

button {
    background: #007bff;
    color: white;
    border: none;
}

button:hover {
    background: #0056b3;
}

.result {
    margin-top: 20px;
    text-align: right;
    background: #f9f9f9;
    padding: 15px;
    border-radius: 10px;
    display: none;
}

.footer {
    position: fixed;
    bottom: 10px;
    left: 15px;
    color: white;
    font-size: 14px;
    text-shadow: 0 0 5px black;
}
</style>
</head>

<body>

<div class="container">
    <h2>🎮 لعبة الحروف</h2>

    <input id="letter" maxlength="1" placeholder="اكتب حرف">
    <button onclick="show()">عرض</button>

    <div class="result" id="box">
        <p>🌍 دولة: <span id="country"></span></p>
        <p>🪑 جماد: <span id="object"></span></p>
        <p>👤 اسم: <span id="name"></span></p>
        <p>🌿 نبات: <span id="plant"></span></p>
        <p>🐾 حيوان: <span id="animal"></span></p>
    </div>
</div>

<div class="footer">حقوق دمعه</div>

<script>
const data = {
"ا":{country:"الإمارات",object:"إبرة",name:"أحمد",plant:"أرز",animal:"أسد"},
"ب":{country:"البحرين",object:"باب",name:"بدر",plant:"بقدونس",animal:"بطة"},
"ت":{country:"تونس",object:"تلفاز",name:"تركي",plant:"تمر",animal:"تمساح"},
"ث":{country:"ثادق",object:"ثلاجة",name:"ثامر",plant:"ثوم",animal:"ثور"},
"ج":{country:"الجزائر",object:"جوال",name:"جاسم",plant:"جزر",animal:"جمل"},
"ح":{country:"الأردن",object:"حقيبة",name:"حسن",plant:"حبق",animal:"حصان"},
"خ":{country:"السعودية",object:"خزانة",name:"خالد",plant:"خس",animal:"خروف"},
"د":{country:"الدنمارك",object:"درج",name:"دانا",plant:"ذرة",animal:"دب"},
"ذ":{country:"الظهران",object:"ذراع",name:"ذياب",plant:"ذرة",animal:"ذئب"},
"ر":{country:"روسيا",object:"راديو",name:"راشد",plant:"رمان",animal:"راكون"},
"ز":{country:"زامبيا",object:"زر",name:"زياد",plant:"زعتر",animal:"زرافة"},
"س":{country:"سوريا",object:"سرير",name:"سالم",plant:"سمسم",animal:"سمكة"},
"ش":{country:"الشيشان",object:"شباك",name:"شادي",plant:"شمام",animal:"شمبانزي"},
"ص":{country:"الصين",object:"صندوق",name:"صالح",plant:"صبار",animal:"صقر"},
"ض":{country:"ضباء",object:"ضوء",name:"ضياء",plant:"ضرو",animal:"ضبع"},
"ط":{country:"طاجيكستان",object:"طاولة",name:"طارق",plant:"طماطم",animal:"طاووس"},
"ظ":{country:"ظفار",object:"ظرف",name:"ظافر",plant:"ظيان",animal:"ظبي"},
"ع":{country:"عمان",object:"عجلة",name:"علي",plant:"عنب",animal:"عصفور"},
"غ":{country:"غانا",object:"غسالة",name:"غسان",plant:"غار",animal:"غزال"},
"ف":{country:"فرنسا",object:"فانوس",name:"فهد",plant:"فلفل",animal:"فيل"},
"ق":{country:"قطر",object:"قلم",name:"قاسم",plant:"قرنبيط",animal:"قرد"},
"ك":{country:"كندا",object:"كرسي",name:"كريم",plant:"كمثرى",animal:"كلب"},
"ل":{country:"لبنان",object:"لوح",name:"ليث",plant:"ليمون",animal:"لقلق"},
"م":{country:"مصر",object:"مكتب",name:"محمد",plant:"موز",animal:"ماعز"},
"ن":{country:"نيجيريا",object:"نافذة",name:"ناصر",plant:"نعناع",animal:"نمر"},
"ه":{country:"هولندا",object:"هاتف",name:"هاني",plant:"هيل",animal:"هدهد"},
"و":{country:"اليمن",object:"وسادة",name:"وليد",plant:"ورد",animal:"وحيد القرن"},
"ي":{country:"اليابان",object:"يد",name:"ياسر",plant:"ياسمين",animal:"يعسوب"}
};

function show(){
let l=document.getElementById("letter").value;
let r=data[l];
document.getElementById("box").style.display="block";

if(r){
country.textContent=r.country;
object.textContent=r.object;
name.textContent=r.name;
plant.textContent=r.plant;
animal.textContent=r.animal;
}else{
country.textContent="لا يوجد";
object.textContent="لا يوجد";
name.textContent="لا يوجد";
plant.textContent="لا يوجد";
animal.textContent="لا يوجد";
}
}
</script>

</body>
</html>
